# =============================================================================
#  coturn — serveur STUN/TURN pour la traversée NAT des appels WebRTC.
#  Adaptez realm, external-ip et les identifiants avant la production.
# =============================================================================
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech

# Identifiants statiques (à remplacer par une auth via secret partagé en prod).
user=amoura:amoura_turn_secret
realm=amoura.local

# Plage de ports relais (à ouvrir dans le pare-feu).
min-port=49152
max-port=65535

# En production, décommentez et renseignez l'IP publique :
# external-ip=VOTRE_IP_PUBLIQUE
no-multicast-peers
no-cli
