# =============================================================================
#  Amoura — exemple de configuration Nginx pour la production (Phase 1).
#  Termine le TLS, sert l'application PHP et proxifie le WebSocket en `wss://`.
#
#  À adapter : server_name, chemins des certificats, ports amont.
#  Obtenez un certificat avec certbot : `certbot --nginx -d amoura.example`
# =============================================================================

# Redirection HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name amoura.example www.amoura.example;
    # Laisser passer le challenge ACME (Let's Encrypt) avant la redirection.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Application HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name amoura.example www.amoura.example;

    ssl_certificate     /etc/letsencrypt/live/amoura.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amoura.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # En-têtes de sécurité (l'app pose déjà CSP/nonce ; HSTS ici en frontal).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;                 # uploads médias (photos/vocal)

    root /var/www/amoura/public;
    index index.php;

    # Fichiers statiques (assets, PWA) servis directement, avec cache long.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Route toutes les autres requêtes vers le front-controller PHP.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.2-fpm.sock;   # ou 127.0.0.1:9000
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    # Ne jamais exposer les fichiers sensibles.
    location ~ /\.(?!well-known) { deny all; }
    location ~* /(\.env|composer\.(json|lock)|database/|app/|tests/) { deny all; }
}

# WebSocket sécurisé — wss://amoura.example/ws  →  serveur Ratchet (127.0.0.1:8090)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ws.amoura.example;

    ssl_certificate     /etc/letsencrypt/live/amoura.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amoura.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;      # bascule WebSocket
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;                       # connexions longues
    }
}
