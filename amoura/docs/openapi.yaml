openapi: 3.0.3
info:
  title: Amoura — API interne
  description: >
    API REST d'Amoura (plateforme SaaS de rencontres). Deux modes
    d'authentification : (1) **session cookie** pour l'application web, avec
    `X-CSRF-Token` sur les requêtes mutatives ; (2) **jeton porteur** (`Bearer`)
    pour les clients mobiles/tiers, sous le préfixe versionné `/api/v1` (stateless,
    sans CSRF). Les jetons sont opaques, révocables et à portée (abilities).
  version: "1.9.0"
servers:
  - url: /
    description: Même origine que l'application
tags:
  - name: Découverte
  - name: Messagerie
  - name: Social
  - name: Temps réel
  - name: Notifications
  - name: Paiements
  - name: Push
  - name: Mobile v1
    description: API mobile stateless (jeton porteur, préfixe /api/v1)

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: amoura_sess
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Jeton d'accès obtenu via `POST /api/v1/auth/login`, transmis en en-tête
        `Authorization: Bearer <jeton>`. Opaque, révocable, expiration ~30 jours.
  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  responses:
    Unauthorized: { description: Authentification requise }
    Forbidden: { description: Accès refusé }
  schemas:
    Ok:
      type: object
      properties: { ok: { type: boolean, example: true } }
    Error:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error: { type: string }
    Profile:
      type: object
      properties:
        id: { type: integer }
        display_name: { type: string }
        age: { type: integer, nullable: true }
        avatar: { type: string }
        is_verified: { type: boolean }
        is_online: { type: boolean }
        interests: { type: array, items: { type: string } }
        affinity: { type: number, description: Score d'affinité (recommandation) }
        distance_km: { type: number, nullable: true }
    User:
      type: object
      properties:
        id: { type: integer }
        display_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        status: { type: string, enum: [pending, active, suspended, banned, deleted] }
        is_verified: { type: boolean }
        role: { type: string, nullable: true }
        created_at: { type: string, nullable: true }
    ApiTokenInfo:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: Libellé de l'appareil/client }
        abilities: { type: array, items: { type: string } }
        last_used_at: { type: string, nullable: true }
        expires_at: { type: string, nullable: true }
        created_at: { type: string }
    Message:
      type: object
      properties:
        id: { type: integer }
        conversation_id: { type: integer }
        sender_id: { type: integer }
        type: { type: string, enum: [text, voice, image] }
        body: { type: string, nullable: true, description: Texte déchiffré (null pour les médias) }
        media_path: { type: string, nullable: true }
        media_meta: { type: object, nullable: true }
        reply_to_id: { type: integer, nullable: true }
        reply_body: { type: string, nullable: true }
        reactions: { type: integer }
        delivered_at: { type: string, nullable: true }
        read_at: { type: string, nullable: true }
        expires_at: { type: string, nullable: true }
        created_at: { type: string, nullable: true }

security:
  - sessionCookie: []

paths:
  /api/v1/auth/login:
    post:
      tags: [Mobile v1]
      summary: Échange identifiants → jeton porteur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, description: Libellé de l'appareil (facultatif) }
      responses:
        "201":
          description: Jeton émis
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  token: { type: string, example: "amoura_…" }
                  token_type: { type: string, example: Bearer }
                  expires_at: { type: string, nullable: true }
                  user: { $ref: "#/components/schemas/User" }
        "401": { description: Identifiants incorrects, $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Compte suspendu, email non vérifié ou 2FA requis" }
        "429": { description: Trop de tentatives (limitation de débit) }
  /api/v1/auth/logout:
    post:
      tags: [Mobile v1]
      summary: Révoque le jeton courant (déconnexion de l'appareil)
      security:
        - bearerAuth: []
      responses:
        "200": { description: Jeton révoqué, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me:
    get:
      tags: [Mobile v1]
      summary: Profil de l'utilisateur authentifié
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Utilisateur courant
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Portée insuffisante, $ref: "#/components/responses/Forbidden" }
  /api/v1/tokens:
    get:
      tags: [Mobile v1]
      summary: Liste des jetons/appareils actifs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Jetons actifs
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  tokens: { type: array, items: { $ref: "#/components/schemas/ApiTokenInfo" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Mobile v1]
      summary: Révoque tous les jetons (déconnecte tous les appareils)
      security:
        - bearerAuth: []
      responses:
        "200": { description: Jetons révoqués, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/tokens/{id}:
    delete:
      tags: [Mobile v1]
      summary: Révoque un jeton précis
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Jeton révoqué, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Jeton introuvable }
  /api/v1/discover:
    get:
      tags: [Mobile v1]
      summary: Fil de découverte reclassé par affinité (mobile)
      security:
        - bearerAuth: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
        - { name: gender, in: query, schema: { type: string } }
        - { name: min_age, in: query, schema: { type: integer } }
        - { name: max_age, in: query, schema: { type: integer } }
        - { name: distance_km, in: query, schema: { type: integer } }
        - { name: smoking, in: query, schema: { type: string, enum: [no, sometimes, yes] } }
        - { name: relationship_goal, in: query, schema: { type: string, enum: [casual, serious, friends, unsure] } }
      responses:
        "200":
          description: Liste de profils
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  profiles: { type: array, items: { $ref: "#/components/schemas/Profile" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Portée insuffisante, $ref: "#/components/responses/Forbidden" }
  /api/v1/swipe:
    post:
      tags: [Mobile v1]
      summary: Like / pass / superlike (mobile)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, action]
              properties:
                target_id: { type: integer }
                action: { type: string, enum: [like, pass, superlike] }
      responses:
        "200":
          description: Swipe enregistré
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  matched: { type: boolean }
                  conversation_id: { type: integer, nullable: true }
        "402": { description: "Quota atteint (upgrade) ou Super Like épuisé (store)" }
        "422": { description: Action invalide }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/matches:
    get:
      tags: [Mobile v1]
      summary: Liste des matches (mobile)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Matches de l'utilisateur
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        match_id: { type: integer }
                        conversation_id: { type: integer, nullable: true }
                        user_id: { type: integer }
                        display_name: { type: string }
                        avatar: { type: string }
                        is_online: { type: boolean }
                        is_verified: { type: boolean }
                        unread: { type: integer }
                        last_message: { type: string, nullable: true }
                        last_message_at: { type: string, nullable: true }
                        matched_at: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/matches/{id}/unmatch:
    post:
      tags: [Mobile v1]
      summary: Retire un match (mobile)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Match retiré, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/conversations:
    get:
      tags: [Mobile v1]
      summary: Liste des conversations (mobile)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Conversations avec aperçu du dernier message déchiffré
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  conversations:
                    type: array
                    items:
                      type: object
                      properties:
                        conversation_id: { type: integer }
                        user_id: { type: integer }
                        display_name: { type: string }
                        avatar: { type: string }
                        is_online: { type: boolean }
                        is_verified: { type: boolean }
                        unread: { type: integer }
                        last_message: { type: string, nullable: true }
                        last_message_at: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/conversations/{id}/messages:
    get:
      tags: [Mobile v1]
      summary: Historique déchiffré d'une conversation (mobile)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: before, in: query, description: id de message pour la pagination (scroll infini), schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 40, maximum: 100 } }
      responses:
        "200":
          description: Messages en ordre chronologique
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
        "403": { description: Conversation inaccessible, $ref: "#/components/responses/Forbidden" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Mobile v1]
      summary: Envoi d'un message texte (mobile, chiffré au repos)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 4000 }
                reply_to_id: { type: integer, nullable: true }
                ttl: { type: integer, description: "Durée de vie en secondes (message éphémère, max 86400)" }
      responses:
        "201":
          description: Message créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { $ref: "#/components/schemas/Message" }
        "403": { description: Conversation inaccessible }
        "422": { description: Message vide }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/conversations/{id}/read:
    post:
      tags: [Mobile v1]
      summary: Accusé de lecture (mobile)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                last_message_id: { type: integer }
      responses:
        "200": { description: Lu, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "403": { description: Conversation inaccessible }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/discover:
    get:
      tags: [Découverte]
      summary: Fil de découverte reclassé par affinité
      parameters:
        - { name: gender, in: query, schema: { type: string } }
        - { name: min_age, in: query, schema: { type: integer } }
        - { name: max_age, in: query, schema: { type: integer } }
        - { name: distance_km, in: query, schema: { type: integer } }
        - { name: smoking, in: query, schema: { type: string, enum: [no, sometimes, yes] } }
        - { name: relationship_goal, in: query, schema: { type: string, enum: [casual, serious, friends, unsure] } }
      responses:
        "200":
          description: Liste de profils
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  profiles: { type: array, items: { $ref: "#/components/schemas/Profile" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/swipe:
    post:
      tags: [Découverte]
      summary: Like / pass / superlike (détecte le match ; superlike consomme un crédit)
      parameters: [ { $ref: "#/components/parameters/Csrf" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, action]
              properties:
                target_id: { type: integer }
                action: { type: string, enum: [like, pass, superlike] }
      responses:
        "200":
          description: Résultat du swipe
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  matched: { type: boolean }
                  conversation_id: { type: integer, nullable: true }
        "402": { description: Quota atteint ou crédit manquant (upgrade/store) }
  /api/conversations/{id}/messages:
    get:
      tags: [Messagerie]
      summary: Historique (déchiffré, hors éphémères expirés)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: before, in: query, schema: { type: integer } }
      responses:
        "200": { description: Messages }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Messagerie]
      summary: Envoi d'un message (chiffré au repos ; réponse citée / éphémère)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { $ref: "#/components/parameters/Csrf" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
                reply_to_id: { type: integer, nullable: true }
                ttl: { type: integer, description: "Durée de vie (s) pour un message éphémère" }
      responses:
        "200": { description: Message créé }
  /api/feed:
    get:
      tags: [Social]
      summary: Fil de publications (modération automatique appliquée)
      responses: { "200": { description: Publications } }
  /api/notifications:
    get:
      tags: [Notifications]
      summary: Notifications paginées par curseur
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Page de notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  unread: { type: integer }
                  next_cursor: { type: string, nullable: true }
  /api/ws-ticket:
    get:
      tags: [Temps réel]
      summary: Ticket signé d'authentification WebSocket
      responses: { "200": { description: "{ ticket, ws_url }" } }
  /api/push/subscribe:
    post:
      tags: [Push]
      summary: Enregistre un abonnement Web Push
      parameters: [ { $ref: "#/components/parameters/Csrf" } ]
      responses: { "200": { $ref: "#/components/schemas/Ok" } }
  /webhooks/{gateway}:
    post:
      tags: [Paiements]
      summary: Webhook prestataire (signature vérifiée + re-check serveur, idempotent)
      parameters:
        - { name: gateway, in: path, required: true, schema: { type: string, enum: [stripe, paypal, cinetpay, paydunya] } }
      responses: { "200": { description: Accusé de réception } }
